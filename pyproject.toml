[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eplai"
version = "0.1.0"
description = "Premier League player intelligence: embeddings, retrieval and a tool-calling agent"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "groq>=0.11",
]

[project.optional-dependencies]
# Everything needed to serve the website backend.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

# Everything needed to retrain embeddings or rebuild the RAG index.
train = [
    "scikit-learn>=1.3",
    "torch>=2.0",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=2.5",
    "faiss-cpu>=1.7",
    "kaggle>=1.6",
]

# Running tests/. The suite also runs standalone: python tests/test_agent_loop.py
dev = [
    "pytest>=8.0",
]

[project.scripts]
eplai-ask = "eplai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
